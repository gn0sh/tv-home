[project]
name = "tv-remote"
version = "0.1.0"
description = "Local stdio MCP server that controls Brian's LG webOS TV and Google TV over the LAN."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "androidtvremote2==0.3.2",
    "aiowebostv==0.10.0",
    "aiohttp==3.14.5",  # used directly by lg.py (SSAP websocket); same version aiowebostv already locks
    "pywebview==6.2.1",  # the PC on-screen remote window (ADR 0006); Edge WebView2 via pythonnet on Windows
]

[project.scripts]
tv-remote = "tv_remote.server:main"
tv-remote-lg = "tv_remote.lgpipe:main"
tv-remote-vizio-pair = "tv_remote.vizio_pair:entry"

[project.gui-scripts]
# A GUI launcher on Windows (no console window): the "TV Remote" icon points at .venv\Scripts\tv-remote-app.exe
tv-remote-app = "tv_remote.pcremote:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
# uv_build has no dependencies of its own, so a fresh install fetches nothing outside uv.lock (finding #8).
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
