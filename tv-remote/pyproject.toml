[project]
name = "tv-remote"
version = "0.1.0"
description = "Local stdio MCP server that controls Brian's LG webOS TV and Google TV over the LAN."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "androidtvremote2==0.3.2",
    "aiowebostv==0.10.0",
    "aiohttp==3.14.5",  # used directly by lg.py (SSAP websocket); same version aiowebostv already locks
]

[project.scripts]
tv-remote = "tv_remote.server:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
# uv_build has no dependencies of its own, so a fresh install fetches nothing outside uv.lock (finding #8).
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
