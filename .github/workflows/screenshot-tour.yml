name: screenshot-tour

# One-off (branch board-tour, never merged): takes the PR run's qa APK (release + R8, debuggable) and runs
# scripts/ci/screenshot-tour.sh on the same Android TV API 34 emulator as android.yml, with made-up data only.
# No secrets are referenced. Actions are pinned to the same SHAs as android.yml.

on:
  push:
    branches: [board-tour]

permissions:
  contents: read

concurrency:
  group: screenshot-tour
  cancel-in-progress: true

env:
  CI: "true"
  APP_DEP_VERIFICATION: strict

jobs:
  tour:
    name: screenshot tour (Android TV, API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # to download the PR run's qa APK artifact
    env:
      TVHOME_BUILD_APP: "true"
      # PR #30 (watch-defaults 2bdaf88): the android.yml run whose qa APK this tour installs.
      PR_RUN_ID: "41724354376"
      PR_HEAD_SHA: 2bdaf88d178e5222f1f3b3b8494f69b61cb872e0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Download the PR's qa APK
        id: prapk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR_RUN_ID" --jq .head_sha)
          [ "$sha" = "$PR_HEAD_SHA" ] || { echo "::error::run $PR_RUN_ID is for $sha, not $PR_HEAD_SHA"; exit 1; }
          gh run download "$PR_RUN_ID" -R "$GITHUB_REPOSITORY" -n tv-home-qa-build-apk -D "$RUNNER_TEMP/pr-apk"
          shopt -s nullglob
          apks=("$RUNNER_TEMP"/pr-apk/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::expected one qa APK in the artifact, found ${#apks[@]}"; exit 1; }
          cp "${apks[0]}" "$RUNNER_TEMP/tour-qa.apk"
          echo "tour: qa APK from run $PR_RUN_ID ($PR_HEAD_SHA), sha256 $(sha256sum "$RUNNER_TEMP/tour-qa.apk" | cut -c1-16)"

      - name: Build the fake TV apps (CDE x2, ESPN)
        run: scripts/ci/tour-fake-apps.sh "$RUNNER_TEMP/fake-apps"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the AVD
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL" || true
          df -h "$HOME" | tail -1

      # One line: the runner executes each script line as its own shell command.
      - name: Screenshot tour
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: false
          disk-size: 2048M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: scripts/ci/screenshot-tour.sh "$RUNNER_TEMP/tour-qa.apk" "$RUNNER_TEMP/tour-shots" "$RUNNER_TEMP/fake-apps"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tv-home-screenshot-tour
          path: ${{ runner.temp }}/tour-shots/*.png
          retention-days: 7
          if-no-files-found: warn
